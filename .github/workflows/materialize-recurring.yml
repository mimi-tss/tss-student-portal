name: Materialize recurring schedules

# Daily top-up so each active recurring weekly schedule always has real
# session rows out to the horizon (lib/scheduling/recurring.ts). Runs
# here rather than Vercel Cron for the same reason as kajabi-sync — see
# that workflow's comment.

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC daily (~6am ET)
  workflow_dispatch: {}

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Call materialize-recurring endpoint
        run: |
          curl -sf -X GET "https://tss-student-portal.vercel.app/api/cron/materialize-recurring" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
