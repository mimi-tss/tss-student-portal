name: Weekly digest

# Student personal digest (email/sms/in-app per their own preference) and
# staff weekly ops summary — no coach digest, coaches get event-driven
# Slack pings instead. Monday morning ET (fixed UTC hour, small DST drift
# accepted, same precedent as materialize-recurring.yml). Runs via GitHub
# Actions for the same reason as kajabi-sync — see that workflow's comment.

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC (~8am ET)
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly-digest endpoint
        run: |
          curl -sf -X GET "https://tss-student-portal.vercel.app/api/cron/weekly-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
